name: Release

# On every push to master (normally the develop -> master merge) or to the 10.x
# maintenance line, analyse conventional-commit messages, bump the version, tag
# it (v-prefixed), update CHANGELOG.md, and publish a GitHub Release.
# master carries the Drupal 11/12 line; 10.x carries Drupal 10 fixes.
# The published Release fires satis-publish.yml, which rebuilds packages.square360.com.
on:
  push:
    branches:
      - master
      - 10.x

jobs:
  semantic_release:
    uses: Square360/shared-workflows/.github/workflows/reusable-semantic-release.yml@v4
    with:
      release_branches: '["master", "10.x"]'
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
